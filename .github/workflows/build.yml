name: Build plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet publish Jellyfin.Plugin.PlexSearch/Jellyfin.Plugin.PlexSearch.csproj -c Release -o out

      - name: Package
        run: |
          mkdir -p package
          cp out/Jellyfin.Plugin.PlexSearch.dll package/
          VERSION=$(grep -oP '(?<=<AssemblyVersion>)[^<]+' Jellyfin.Plugin.PlexSearch/Jellyfin.Plugin.PlexSearch.csproj)
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > package/meta.json <<EOF
          {
            "category": "General",
            "changelog": "",
            "description": "Search a Plex server (including ones shared with you) from Jellyfin search.",
            "guid": "8b7cf052-6c7a-4264-9f46-2834493ee694",
            "name": "Plex Search",
            "overview": "Adds an On Plex section to Jellyfin search.",
            "owner": "wesknapp",
            "targetAbi": "10.11.0.0",
            "timestamp": "$TIMESTAMP",
            "version": "$VERSION",
            "status": "Active",
            "autoUpdate": false,
            "assemblies": ["Jellyfin.Plugin.PlexSearch.dll"]
          }
          EOF
          (cd package && zip -r ../plexsearch_${VERSION}.zip .)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match AssemblyVersion ${VERSION} (expected v${VERSION})"
            exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: plexsearch_${{ env.VERSION }}
          path: package/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: plexsearch_*.zip

      # Adds this version to manifest.json on main, which Jellyfin reads as a plugin repository.
      - name: Update plugin repository manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ZIP=plexsearch_${VERSION}.zip
          CHECKSUM=$(md5sum "$ZIP" | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ZIP}"
          git fetch origin main
          git checkout -B main origin/main
          jq --arg v "$VERSION" --arg url "$URL" --arg sum "$CHECKSUM" --arg ts "$TIMESTAMP" \
            '.[0].versions = ([{version: $v, changelog: "See GitHub release", targetAbi: "10.11.0.0", sourceUrl: $url, checksum: $sum, timestamp: $ts}]
                              + (.[0].versions | map(select(.version != $v))))' \
            manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add ${VERSION} to plugin manifest"
          git push origin main
