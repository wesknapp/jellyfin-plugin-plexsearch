name: Build plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet publish Jellyfin.Plugin.PlexSearch/Jellyfin.Plugin.PlexSearch.csproj -c Release -o out

      - name: Package
        run: |
          mkdir -p package
          cp out/Jellyfin.Plugin.PlexSearch.dll package/
          VERSION=$(grep -oP '(?<=<AssemblyVersion>)[^<]+' Jellyfin.Plugin.PlexSearch/Jellyfin.Plugin.PlexSearch.csproj)
          cat > package/meta.json <<EOF
          {
            "category": "General",
            "changelog": "",
            "description": "Search a Plex server (including ones shared with you) from Jellyfin search.",
            "guid": "8b7cf052-6c7a-4264-9f46-2834493ee694",
            "name": "Plex Search",
            "overview": "Adds an On Plex section to Jellyfin search.",
            "owner": "wesknapp",
            "targetAbi": "10.11.0.0",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "version": "$VERSION",
            "status": "Active",
            "autoUpdate": false,
            "assemblies": ["Jellyfin.Plugin.PlexSearch.dll"]
          }
          EOF
          (cd package && zip -r ../plexsearch_${VERSION}.zip .)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: plexsearch_${{ env.VERSION }}
          path: package/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: plexsearch_*.zip
